<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101114;
            color: white;
            min-height: 100vh;
            display: grid;
            place-items: center;
        }

        main {
            text-align: center;
            padding: 32px;
        }

        h1 {
            font-size: clamp(36px, 7vw, 64px);
            margin-bottom: 12px;
        }

        span {
            color: #ff5500;
        }

        p {
            color: #b8bac3;
            line-height: 1.7;
        }

        button {
            background: #ff5500;
            color: white;
            border: 0;
            padding: 13px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <main>
        <h1>My First <span>Website</span></h1>
        <p>I am learning to build and deploy websites with AI.</p>
        <button onclick="alert('My first website is working!')">
            Test My Website
        </button>
    </main>
</body>

</html>
